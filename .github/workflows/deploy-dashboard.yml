name: Deploy dashboard

# docs/dashboard/index.html, app.js, matchup.js, teams.js, and images/ are
# committed build output (see docs/dashboard.md's "Publishing (GitHub
# Pages)" section) — this workflow doesn't rebuild them, it just publishes
# whatever's checked in under docs/ via GitHub Actions on every push to
# main, instead of relying on GitHub Pages' own branch-polling deployment.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
